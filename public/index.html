<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freiheit & Determination – Ethik 12 Bayern</title>
  <meta name="description" content="Gamifizierte Lernplattform zum Thema Willensfreiheit und Neurobiologie für den Ethikunterricht der 12. Jahrgangsstufe Bayern.">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     LOGIN SCREEN
═══════════════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🧠</div>
    <h1 class="login-title" style="font-size:1.7rem;">Freiheit & Determination</h1>
    <p class="login-subtitle">Ethik · 12. Jahrgangsstufe · Bayern<br>Melde dich mit deinem Namen und deiner PIN an.</p>

    <div id="login-error" class="login-error hidden"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-name">Dein Name</label>
        <input class="input-field" type="text" id="login-name" placeholder="z.B. Max Mustermann" required autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pin">PIN (4-stellig)</label>
        <input class="input-field" type="password" id="login-pin" placeholder="••••" maxlength="8" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Anmelden →</button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--text-muted);">
      Du hast noch keinen Zugang? Wende dich an deine Lehrkraft.
    </p>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     APP SCREEN
═══════════════════════════════════════════════════════════════════ -->
<div id="app-screen" class="hidden">

  <!-- TOPBAR -->
  <nav id="topbar">
    <div class="container">
      <div class="topbar-inner">
        <div class="topbar-brand">🧠 Freiheit &amp; Determination</div>
        <div class="topbar-student">
          <div class="topbar-xp" id="topbar-xp">⭐ 0 XP</div>
          <div class="topbar-level" id="topbar-level">🌱 Lernende:r</div>
          <span id="topbar-name" style="font-size:0.875rem;color:var(--text-secondary);"></span>
          <button class="btn btn-secondary btn-sm" onclick="logout()">Abmelden</button>
        </div>
      </div>
      <div style="padding:0.3rem 0;">
        <div class="progress-bar-wrap" style="height:4px;">
          <div class="progress-bar-fill" id="topbar-progress" style="width:0%"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="container" style="padding-top:1.5rem;padding-bottom:4rem;">

    <!-- NAV -->
    <nav class="main-nav" role="navigation" aria-label="Hauptnavigation">
      <button class="nav-btn active" data-view="dashboard" onclick="renderView('dashboard')" id="nav-dashboard">🏠 Dashboard</button>
      <button class="nav-btn" data-view="kapitel" onclick="renderView('kapitel')" id="nav-kapitel">📚 Kapitel</button>
      <button class="nav-btn" data-view="quiz" onclick="renderView('quiz')" id="nav-quiz">🎯 Quiz</button>
      <button class="nav-btn" data-view="essay" onclick="renderView('essay')" id="nav-essay">✍️ Aufgabe</button>
      <button class="nav-btn" data-view="glossar" onclick="renderView('glossar')" id="nav-glossar">📖 Glossar</button>
      <button class="nav-btn" data-view="tagebuch" onclick="renderView('tagebuch')" id="nav-tagebuch">📝 Tagebuch</button>
    </nav>

    <!-- CONTENT -->
    <div id="main-content"></div>

  </main>
</div>

<script src="/js/content.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
