<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lehrkraft-Dashboard – Freiheit & Determination</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body { background: var(--bg-card); }
    .dashboard-header {
      background: var(--bg-base); border-bottom: 1px solid var(--border);
      padding: 1.25rem 0; margin-bottom: 2rem;
    }
    .data-table {
      width: 100%; border-collapse: collapse; margin-top: 1rem;
      background: var(--bg-card2); border-radius: var(--radius-md);
      overflow: hidden; border: 1px solid var(--border);
    }
    .data-table th, .data-table td {
      padding: 1rem; text-align: left; border-bottom: 1px solid var(--border);
    }
    .data-table th {
      background: rgba(124,58,237,0.1); color: var(--violet-light);
      font-weight: 600; text-transform: uppercase; font-size: 0.8rem;
      letter-spacing: 0.05em; cursor: pointer;
    }
    .data-table th:hover { background: rgba(124,58,237,0.2); }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }
    .action-btn {
      background: none; border: 1px solid var(--border);
      color: var(--text-secondary); cursor: pointer;
      border-radius: var(--radius-sm); padding: 0.4rem 0.75rem;
      font-size: 0.8rem; transition: var(--transition);
    }
    .action-btn:hover { background: var(--violet); color: #fff; border-color: var(--violet); }
    .action-btn.danger:hover { background: var(--rose); color: #fff; border-color: var(--rose); }
    .detail-view { display: none; }
  </style>
</head>
<body>

<div id="login-view" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <h1 class="login-title">Lehrkraft-Dashboard</h1>
    <p class="login-subtitle">Bitte gib das Dashboard-Passwort ein.</p>
    <div id="login-err" class="login-error hidden"></div>
    <form id="dash-login-form">
      <div class="form-group">
        <input type="password" id="dash-pw" class="input-field" placeholder="Passwort" required>
      </div>
      <button class="btn btn-primary btn-block">Anmelden →</button>
    </form>
  </div>
</div>

<div id="dashboard-view" class="hidden">
  <header class="dashboard-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
      <h1 style="font-family:'Inter',sans-serif;font-size:1.4rem;">📊 Lehrkraft-Dashboard</h1>
      <button class="btn btn-secondary btn-sm" onclick="location.reload()">Abmelden</button>
    </div>
  </header>

  <main class="container">
    
    <!-- ÜBERSICHT -->
    <div id="view-list">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
        <h2 style="font-family:'Inter',sans-serif;font-size:1.25rem;">Schüler-Fortschritt</h2>
        <button class="btn btn-primary btn-sm" onclick="showAddStudent()">+ Schüler:in hinzufügen</button>
      </div>
      
      <div style="display:flex;gap:1rem;margin-bottom:1rem;">
        <input type="text" id="search-input" class="input-field" placeholder="Name suchen..." onkeyup="renderTable()" style="max-width:300px;">
        <div class="hero-stat" style="background:var(--bg-card2);padding:0.5rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border);">
          <span class="hero-stat-label">Gesamt SuS</span>
          <span class="hero-stat-value" id="stat-total" style="font-size:1.2rem;">0</span>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th onclick="setSort('name')">Name ↕</th>
            <th onclick="setSort('class')">Klasse ↕</th>
            <th onclick="setSort('completedChapters')">Kapitel ↕</th>
            <th onclick="setSort('totalXp')">XP ↕</th>
            <th onclick="setSort('badgeCount')">Badges ↕</th>
            <th onclick="setSort('lastActivity')">Zuletzt aktiv ↕</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody id="student-tbody"></tbody>
      </table>
    </div>

    <!-- ADD STUDENT MODAL -->
    <div id="add-modal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width:400px;">
        <h2 style="margin-bottom:1rem;">Schüler:in hinzufügen</h2>
        <div id="add-err" class="login-error hidden"></div>
        <div class="form-group"><input type="text" id="add-name" class="input-field" placeholder="Name"></div>
        <div class="form-group"><input type="text" id="add-class" class="input-field" placeholder="Klasse (opt.)"></div>
        <div class="form-group"><input type="text" id="add-pin" class="input-field" placeholder="PIN (4-stellig)"></div>
        <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem;">
          <button class="btn btn-secondary" onclick="document.getElementById('add-modal').classList.add('hidden')">Abbrechen</button>
          <button class="btn btn-primary" onclick="addStudent()">Hinzufügen</button>
        </div>
      </div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="view-detail" class="hidden">
      <button class="chapter-back-btn" onclick="closeDetail()">← Zurück zur Übersicht</button>
      <div id="detail-content"></div>
    </div>

  </main>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
